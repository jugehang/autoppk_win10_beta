[package]
name = "autopmx"
version = "0.1.0"
description = "AutoPMX PopPK modeling workbench (Tauri cross-platform)"
edition = "2021"

[lib]
name = "autopmx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
window-vibrancy = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
