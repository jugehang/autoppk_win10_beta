<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoPMX (DuDu PMx Workbench) — 项目全域文档</title>
<style>
  :root {
    --bg: #1a1a2e;
    --slide-bg: #16213e;
    --text: #e4e4e7;
    --text-secondary: #a1a1aa;
    --accent: #60a5fa;
    --accent-light: #1e3a5f;
    --border: #2d3a52;
    --radius: 12px;
    --success: #34d399;
    --warning: #fbbf24;
    --danger: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
  }

  /* ── Slide Deck Container ── */
  .deck {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    box-shadow: 0 0 60px rgba(96, 165, 250, 0.15);
  }

  /* ── Slides ── */
  .slides {
    width: 100%;
    height: 100%;
    position: relative;
  }

  .slide {
    position: absolute;
    inset: 0;
    background: var(--slide-bg);
    padding: 56px 72px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
    overflow-y: auto;
    overflow-x: hidden;
  }

  .slide.active {
    opacity: 1;
    transform: translateX(0);
    pointer-events: auto;
  }

  .slide h2 {
    font-size: 1.5em;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--accent);
    border-bottom: 2px solid var(--accent-light);
    padding-bottom: 12px;
    flex-shrink: 0;
  }

  .slide h3 {
    font-size: 1.1em;
    font-weight: 600;
    color: var(--accent);
    margin-top: 20px;
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .slide h4 {
    font-size: 1em;
    font-weight: 600;
    margin-top: 16px;
    margin-bottom: 8px;
    flex-shrink: 0;
  }

  .slide p { margin-bottom: 10px; color: var(--text-secondary); line-height: 1.6; }
  .slide p strong { color: var(--text); }

  .slide ul, .slide ol { margin: 6px 0 14px 22px; color: var(--text-secondary); line-height: 1.6; }
  .slide li { margin-bottom: 4px; }
  .slide li strong { color: var(--text); }

  /* ── Cover Slide ── */
  .slide.cover {
    justify-content: center;
    align-items: center;
    text-align: center;
    background: linear-gradient(160deg, #0f172a 0%, #1e3a5f 50%, #16213e 100%);
  }
    .slide.cover .logo-icon {
    margin-bottom: 20px;
  }
    .slide.cover .logo-icon img {
    width: 120px; height: 120px; border-radius: 22%; object-fit: contain;
    filter: drop-shadow(0 4px 20px rgba(96, 165, 250, 0.3));
  }
  .slide.cover h1 {
    font-size: 2.8em;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 50%, #34d399 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .slide.cover .subtitle {
    font-size: 1.15em;
    color: var(--text-secondary);
    margin-bottom: 40px;
    font-weight: 400;
  }
  .slide.cover .cover-meta {
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 0.95em;
    color: var(--text-secondary);
  }
  .slide.cover .cover-meta .author {
    font-size: 1.1em;
    color: var(--text);
    font-weight: 600;
  }
  .slide.cover .cover-meta .company {
    color: var(--accent);
    font-weight: 500;
  }
  .slide.cover .cover-line {
    width: 60px;
    height: 2px;
    background: var(--accent);
    margin: 20px auto;
    border-radius: 1px;
  }

  /* ── Navigation ── */
  .nav {
    position: absolute;
    bottom: 24px;
    right: 32px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 10;
    font-size: 0.85em;
  }

  .nav-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: rgba(45, 58, 82, 0.6);
    backdrop-filter: blur(8px);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1em;
    transition: all 0.2s;
  }
  .nav-btn:hover { background: var(--accent-light); border-color: var(--accent); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }

  .page-indicator {
    display: flex;
    gap: 6px;
    margin: 0 6px;
  }
  .page-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.3s;
  }
  .page-dot.active {
    background: var(--accent);
    width: 24px;
    border-radius: 4px;
  }

  .page-num {
    color: var(--text-secondary);
    min-width: 50px;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }

  /* ── Cards ── */
  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
    flex-shrink: 0;
  }
  .card-grid.two { grid-template-columns: repeat(2, 1fr); }
  .card-grid.four { grid-template-columns: repeat(4, 1fr); }

  .card {
    background: rgba(30, 58, 95, 0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    transition: border-color 0.2s;
  }
  .card:hover { border-color: var(--accent); }
  .card .icon { font-size: 1.3em; margin-bottom: 6px; }
  .card h4 { font-size: 0.93em; margin-top: 0; margin-bottom: 5px; }
  .card p { font-size: 0.85em; margin-bottom: 0; }

  /* ── Tags ── */
  .tag {
    display: inline-block;
    background: rgba(45, 58, 82, 0.5);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 7px;
    font-size: 0.78em;
    font-weight: 500;
    color: var(--text-secondary);
  }
  .tag.accent { background: var(--accent-light); border-color: var(--accent); color: var(--accent); }
  .tag.success { background: rgba(52, 211, 153, 0.15); border-color: var(--success); color: var(--success); }
  .tag.warning { background: rgba(251, 191, 36, 0.15); border-color: var(--warning); color: var(--warning); }
  .tag.danger  { background: rgba(248, 113, 113, 0.15); border-color: var(--danger); color: var(--danger); }

  /* ── Tables ── */
  .info-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.84em;
    flex-shrink: 0;
  }
  .info-table th, .info-table td {
    padding: 9px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  .info-table th {
    background: var(--accent-light);
    color: var(--accent);
    font-weight: 600;
    white-space: nowrap;
  }
  .info-table td { color: var(--text-secondary); }
  .info-table td:first-child { font-weight: 500; color: var(--text); }

  /* ── Code ── */
  code {
    background: rgba(30, 58, 95, 0.5);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: "SF Mono", "Menlo", "Monaco", monospace;
    font-size: 0.85em;
    color: var(--accent);
  }
  pre {
    background: #0d1117;
    color: #c9d1d9;
    padding: 14px 18px;
    border-radius: var(--radius);
    overflow-x: auto;
    font-size: 0.78em;
    line-height: 1.55;
    margin: 8px 0 14px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  /* ── Flow ── */
  .flow {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: center;
    margin: 12px 0 18px;
    flex-shrink: 0;
  }
  .flow-box {
    background: var(--accent-light);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 8px 14px;
    font-weight: 600;
    font-size: 0.85em;
    color: var(--accent);
  }
  .flow-arrow { font-size: 1.2em; color: var(--text-secondary); }

  /* ── Arch ── */
  .arch-layer { margin-bottom: 14px; flex-shrink: 0; }
  .arch-layer h4 { color: var(--accent); margin-bottom: 5px; font-size: 0.9em; }
  .arch-items { display: flex; flex-wrap: wrap; gap: 6px; }
  .arch-item {
    background: rgba(30, 58, 95, 0.3);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 6px 12px;
    font-size: 0.82em;
  }
  .arch-item .name { font-weight: 600; color: var(--text); }
  .arch-item .desc { font-size: 0.85em; color: var(--text-secondary); }

  /* ── Compact helpers ── */
  .compact h2 { margin-bottom: 14px; font-size: 1.35em; }
  .compact h3 { margin-top: 12px; margin-bottom: 6px; font-size: 1em; }
  .compact .card-grid { gap: 10px; }
  .compact .card { padding: 12px 14px; }
  .compact .card h4 { font-size: 0.88em; }
  .compact .card p { font-size: 0.8em; }
  .compact .info-table th, .compact .info-table td { padding: 6px 10px; font-size: 0.8em; }

  /* ── TOC grid ── */
  .toc-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  .toc-item {
    background: rgba(30, 58, 95, 0.3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .toc-item:hover { border-color: var(--accent); background: rgba(30, 58, 95, 0.5); }
  .toc-item .num { font-size: 0.8em; color: var(--accent); margin-bottom: 4px; }
  .toc-item .title { font-weight: 700; font-size: 1.05em; margin-bottom: 4px; }
  .toc-item .desc { font-size: 0.82em; color: var(--text-secondary); }

  /* ── Scrollbar ── */
  .slide::-webkit-scrollbar { width: 5px; }
  .slide::-webkit-scrollbar-track { background: transparent; }
  .slide::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Keyboard hint ── */
  .kb-hint {
    position: absolute;
    bottom: 28px;
    left: 32px;
    font-size: 0.72em;
    color: rgba(161, 161, 170, 0.4);
    z-index: 10;
  }
</style>
</head>

// ── Render ──
const container = document.getElementById('slidesContainer');
const dotsContainer = document.getElementById('pageDots');
const pageNumEl = document.getElementById('pageNum');
let current = 0;
const total = slides.length;

function renderAll() {
  container.innerHTML = '';
  dotsContainer.innerHTML = '';
  slides.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'slide' + (s.cls ? ' ' + s.cls : '');
    div.innerHTML = s.html;
    if (i === current) div.classList.add('active');
    container.appendChild(div);

    // TOC click handlers
    div.querySelectorAll('.toc-item[data-slide]').forEach(item => {
      item.addEventListener('click', () => goTo(parseInt(item.dataset.slide)));
    });

    // Page dot
    const dot = document.createElement('div');
    dot.className = 'page-dot' + (i === current ? ' active' : '');
    dot.addEventListener('click', () => goTo(i));
    dotsContainer.appendChild(dot);
  });
  updateNav();
}

function goTo(i) {
  if (i < 0 || i >= total || i === current) return;
  const prev = current;
  current = i;
  const allSlides = container.querySelectorAll('.slide');
  const dir = i > prev ? 40 : -40;

  // Outgoing
  allSlides[prev].style.opacity = '0';
  allSlides[prev].style.transform = `translateX(${-dir}px)`;

  // Incoming
  allSlides[i].style.opacity = '1';
  allSlides[i].style.transform = 'translateX(0)';
  allSlides[i].classList.add('active');
  allSlides[prev].classList.remove('active');

  // Also set all other slides to inactive
  allSlides.forEach((s, idx) => {
    if (idx !== i && idx !== prev) {
      s.classList.remove('active');
      s.style.opacity = '0';
      s.style.transform = idx < i ? 'translateX(-40px)' : 'translateX(40px)';
    }
  });

  updateNav();
}

function updateNav() {
  pageNumEl.textContent = `${current + 1} / ${total}`;
  document.querySelectorAll('.page-dot').forEach((d, i) => {
    d.classList.toggle('active', i === current);
  });
  document.getElementById('prevBtn').disabled = current === 0;
  document.getElementById('nextBtn').disabled = current === total - 1;
}

// ── Init ──
renderAll();

// ── Events ──
document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') {
    e.preventDefault();
    goTo(current + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    e.preventDefault();
    goTo(current - 1);
  } else if (e.key === 'Home') {
    e.preventDefault();
    goTo(0);
  } else if (e.key === 'End') {
    e.preventDefault();
    goTo(total - 1);
  }
});
</script>
